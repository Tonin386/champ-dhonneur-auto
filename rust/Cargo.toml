[package]
name = "champ_rs"
version = "0.1.0"
edition = "2021"
description = "Moteur de Champ d'honneur, encodage et recherche Gumbel IS-MCTS en Rust (auto-jeu rapide)"
publish = false

[lib]
name = "champ_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
