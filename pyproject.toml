[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "champ-dhonneur"
version = "0.2.0"
description = "Moteur, notation, interfaces et IA pour le jeu Champ d'honneur (War Chest)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "numpy>=1.26"]
ia = ["torch>=2.4", "numpy>=1.26", "tensorboard>=2.15"]

[project.scripts]
champ = "champ_dhonneur.cli:main"

[tool.setuptools.packages.find]
include = ["champ_dhonneur*"]

[tool.setuptools.package-data]
"champ_dhonneur.server" = ["static/*", "static/img/*", "static/img/*/*", "web/*", "web/assets/*"]
